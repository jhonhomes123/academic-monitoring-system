<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Student Setup | AMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root{--primary:#0b3d91;--secondary:#1f6bff;--light:#f4f7fc;--white:#fff;--text:#1e293b;--gray:#64748b;--border:#dbe4f0;--danger:#b42318}
        *{box-sizing:border-box}
        body{margin:0;min-height:100vh;background:var(--light);font-family:'Inter',sans-serif;color:var(--text);display:grid;place-items:center;padding:24px}
        .setup-shell{width:min(100%,760px);background:var(--white);border:1px solid var(--border);border-radius:12px;box-shadow:0 15px 40px rgba(11,61,145,.09);overflow:hidden}
        .setup-header{background:var(--white);color:var(--text);padding:25px 30px;display:flex;align-items:center;gap:15px;border-bottom:1px solid var(--border)}
        .setup-header img{width:48px;height:48px;object-fit:contain}
        .setup-header h1{font-size:22px;color:var(--primary);margin:0 0 5px;font-weight:800}.setup-header p{margin:0;color:var(--gray);font-size:13px}
        .setup-content{padding:28px 30px 30px}.setup-content>p{color:var(--gray);margin:0 0 22px;line-height:1.6}
        .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
        .field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}
        label{font-weight:600;font-size:14px;color:var(--primary)}
        input,select{width:100%;min-height:46px;padding:11px 13px;border:1px solid var(--border);border-radius:8px;background:white;color:var(--text);font:inherit}
        input:focus,select:focus{outline:3px solid rgba(31,107,255,.15);border-color:var(--secondary)}
        .password-note{font-size:12px;color:var(--gray);line-height:1.4}
        .submit-button{margin-top:22px;width:100%;min-height:48px;border:0;border-radius:8px;background:var(--primary);color:white;font-weight:700;font-size:15px;cursor:pointer}
        .submit-button:hover{background:#082d6b}
        .submit-button:disabled{opacity:.65;cursor:wait}
        .form-error{min-height:20px;margin-top:12px;color:var(--danger);font-size:14px}
        @media(max-width:560px){body{padding:12px}.setup-header{padding:20px}.setup-content{padding:22px 20px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
    </style>
</head>
<body>
    <main class="setup-shell">
        <header class="setup-header">
            <img src="school_logo.png" alt="Talisay City College logo">
            <div><h1>Complete Your Student Account</h1><p>Academic Monitoring System · Talisay City College</p></div>
        </header>
        <section class="setup-content">
            <p>Add your contact email and enrollment details, then replace the temporary password to finish setting up your account.</p>
            <form id="setupForm">
                <div class="form-grid" id="enrollmentFields">
                    <div class="field"><label for="studentEmail">Email address</label><input id="studentEmail" type="email" autocomplete="email" required></div>
                    <div class="field"><label for="yearSelect">Year level</label><select id="yearSelect" required><option value="">Select year</option><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select></div>
                    <div class="field"><label for="departmentSelect">Department</label><select id="departmentSelect" required><option value="">Select department</option></select></div>
                    <div class="field"><label for="majorSelect">Major</label><select id="majorSelect" required disabled><option value="">Select major</option></select></div>
                    <div class="field"><label for="sectionSelect">Section</label><select id="sectionSelect" required disabled><option value="">Select section</option></select></div>
                </div>
                <div class="form-grid" id="passwordFields" style="margin-top:16px;">
                    <div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required><span class="password-note">Use at least 8 characters. You can change it later.</span></div>
                    <div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></div>
                </div>
                <button id="saveButton" class="submit-button" type="submit">Save and Continue</button>
                <div id="formError" class="form-error" role="alert"></div>
            </form>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL='https://nrqrsolfowebujogawti.supabase.co';
        const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJucXJzb2xmb3dlYnVqb2dhd3RpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyODE2NjksImV4cCI6MjA5NDg1NzY2OX0.XcawTf9niOIZbG0hBTtwSXjySWfdVl3LAClbWdZmfl8';
        const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
        const FUNCTIONS_URL=`${SUPABASE_URL}/functions/v1/manage-student-accounts`;
        const form=document.getElementById('setupForm');
        const errorBox=document.getElementById('formError');
        const saveButton=document.getElementById('saveButton');
        const departmentSelect=document.getElementById('departmentSelect');
        const majorSelect=document.getElementById('majorSelect');
        const yearSelect=document.getElementById('yearSelect');
        const sectionSelect=document.getElementById('sectionSelect');
        let currentUser=null;
        let currentStudentNumber='';
        let passwordOnlyMode=false;
        let currentAccessToken='';

        async function loadSetupOptions(scope, values={}){
            const response=await fetch(FUNCTIONS_URL,{
                method:'POST',
                headers:{'Content-Type':'application/json',apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${currentAccessToken}`},
                body:JSON.stringify({action:'load-setup-options',scope,...values})
            });
            const result=await response.json();
            if(!response.ok) throw new Error(result.error||'Unable to load enrollment options.');
            return result.data||[];
        }

        async function loadDepartments(){
            departmentSelect.innerHTML='<option value="">Select department</option>';
            majorSelect.innerHTML='<option value="">Select major</option>';
            sectionSelect.innerHTML='<option value="">Select section</option>';
            departmentSelect.disabled=true;
            majorSelect.disabled=true;
            sectionSelect.disabled=true;
            if(!yearSelect.value) return;
            const data=await loadSetupOptions('departments');
            data.forEach(item=>departmentSelect.add(new Option(item.department_name,item.department_id)));
            departmentSelect.disabled=false;
        }

        async function loadMajors(){
            majorSelect.innerHTML='<option value="">Select major</option>';
            sectionSelect.innerHTML='<option value="">Select section</option>';
            majorSelect.disabled=true;
            sectionSelect.disabled=true;
            if(!yearSelect.value||!departmentSelect.value) return;
            const data=await loadSetupOptions('majors',{department_id:departmentSelect.value});
            data.forEach(item=>majorSelect.add(new Option(item.major_name,item.major_id)));
            majorSelect.disabled=false;
        }

        async function loadSections(){
            sectionSelect.innerHTML='<option value="">Select section</option>';
            sectionSelect.disabled=true;
            if(!majorSelect.value||!yearSelect.value) return;
            const data=await loadSetupOptions('sections',{major_id:majorSelect.value,year_level:yearSelect.value});
            data.forEach(item=>sectionSelect.add(new Option(item.section_name,item.section_id)));
            sectionSelect.disabled=false;
        }

        async function initialize(){
            let { data: { session }, error } = await supabaseClient.auth.getSession();
            let user = session?.user || null;
            if (!user) {
                const handoffValue = sessionStorage.getItem('ams_student_setup_session');
                if (handoffValue) {
                    sessionStorage.removeItem('ams_student_setup_session');
                    try {
                        const handoff = JSON.parse(handoffValue);
                        const restored = await supabaseClient.auth.setSession(handoff);
                        session = restored.data?.session || null;
                        user = session?.user || null;
                        error = restored.error || error;
                    } catch (restoreError) {
                        error = restoreError;
                    }
                }
            }
            if (!user) {
                const refreshed = await supabaseClient.auth.refreshSession();
                session = refreshed.data?.session || null;
                user = session?.user || null;
                error = refreshed.error || error;
            }
            if (!user) {
                errorBox.innerHTML = 'Your sign-in session could not be restored. <a href="login.html">Return to Login</a>, sign in again, and complete setup without closing the browser tab.';
                console.error('Onboarding session could not be restored', error);
                return;
            }
            currentUser=user;
            session=await supabaseClient.auth.getSession().then(result=>result.data.session);
            currentAccessToken=session?.access_token||'';
            if(!currentAccessToken){errorBox.textContent='Your sign-in session expired. Return to Login and try again.';return;}
            const {data:appUser,error:appError}=await supabaseClient.from('users').select('role_id, email, onboarding_required, force_password_change').eq('user_id',user.id).maybeSingle();
            if(appError||!appUser||Number(appUser.role_id)!==3){errorBox.textContent='This setup page is only for student accounts.';return;}
            const {data:profile,error:profileError}=await supabaseClient.from('students').select('student_number, section_id').eq('user_id',user.id).maybeSingle();
            if(profileError||!profile){errorBox.textContent='Student profile not found. Please contact an administrator.';return;}
            currentStudentNumber=profile.student_number||'';
            const internalStudentLogin=Boolean(appUser.email?.endsWith('@accounts.tcc.invalid'));
            const requestedSetupMode=new URLSearchParams(window.location.search).get('mode')==='setup';
            const onboardingRequired=Boolean(requestedSetupMode||appUser.onboarding_required||user.user_metadata?.onboarding_required||internalStudentLogin||profile.section_id==null);
            const passwordChangeRequired=Boolean(appUser.force_password_change||user.user_metadata?.force_password_change);
            passwordOnlyMode=passwordChangeRequired&&!onboardingRequired;
            if(passwordOnlyMode){
                document.getElementById('enrollmentFields').style.display='none';
                document.querySelectorAll('#enrollmentFields [required]').forEach(field=>field.required=false);
                document.querySelector('.setup-header h1').textContent='Choose a New Password';
                document.querySelector('.setup-content>p').textContent='Your administrator reset your password. Choose a new password to continue; your student details and section will stay unchanged.';
                document.querySelector('#newPassword + .password-note').textContent='Use at least 8 characters.';
                document.getElementById('saveButton').textContent='Save New Password';
                return;
            }
            if(!onboardingRequired){
                errorBox.textContent='This account is not marked for first-time setup. Sign in normally or contact the administrator if this is a newly created student account.';
                return;
            }
            await loadDepartments();
        }

        yearSelect.addEventListener('change',()=>loadDepartments().catch(showError));
        departmentSelect.addEventListener('change',()=>loadMajors().catch(showError));
        majorSelect.addEventListener('change',()=>loadSections().catch(showError));

        function showError(error){errorBox.textContent=error?.message||'Unable to load the form. Please retry.';}

        form.addEventListener('submit',async event=>{
            event.preventDefault();
            errorBox.textContent='';
            const password=document.getElementById('newPassword').value;
            if(password!==document.getElementById('confirmPassword').value){errorBox.textContent='The passwords do not match.';return;}
            const {data:{session}}=await supabaseClient.auth.getSession();
            if(!session){errorBox.textContent='Your sign-in session expired. Return to Login, sign in again, and retry setup.';saveButton.disabled=false;saveButton.textContent='Save and Continue';return;}
            saveButton.disabled=true;
            saveButton.textContent='Saving...';
            try{
                if(passwordOnlyMode){
                    const response=await fetch(FUNCTIONS_URL,{
                        method:'POST',
                        headers:{'Content-Type':'application/json',apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${session.access_token}`},
                        body:JSON.stringify({action:'complete-password-change',password})
                    });
                    const result=await response.json();
                    if(!response.ok) throw new Error(result.error||'Unable to update password.');
                    window.location.replace('student_dashboard.html');
                    return;
                }
                const response=await fetch(FUNCTIONS_URL,{
                    method:'POST',
                    headers:{'Content-Type':'application/json',apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${session.access_token}`},
                    body:JSON.stringify({
                        action:'complete-onboarding',
                        email:document.getElementById('studentEmail').value.trim(),
                        department_id:departmentSelect.value,
                        major_id:majorSelect.value,
                        year_level:yearSelect.value,
                        section_id:sectionSelect.value,
                        password
                    })
                });
                const result=await response.json();
                if(!response.ok) throw new Error(result.error||'Unable to complete setup.');
                const loginAlias=`student-${currentStudentNumber.trim().toLowerCase()}@accounts.tcc.invalid`;
                await supabaseClient.auth.signOut();
                const {error:loginError}=await supabaseClient.auth.signInWithPassword({email:loginAlias,password});
                if(loginError) throw new Error('Setup saved, but please sign in again with your new email and password.');
                window.location.replace('student_dashboard.html');
            }catch(error){showError(error);saveButton.disabled=false;saveButton.textContent='Save and Continue';}
        });

        initialize().catch(showError);
    </script>
</body>
</html>
