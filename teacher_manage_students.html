/* ================= CUSTOM AMS ALERT ================= */

.ams-alert{
    position:fixed;
    top:30px;
    right:30px;
    min-width:340px;
    max-width:420px;
    background:white;
    border-radius:20px;
    padding:22px;
    box-shadow:0 20px 45px rgba(0,0,0,0.15);
    border-left:6px solid var(--primary);
    z-index:99999;

    display:flex;
    gap:18px;
    align-items:flex-start;

    transform:translateX(500px);
    opacity:0;

    transition:.4s ease;
}

.ams-alert.show{
    transform:translateX(0);
    opacity:1;
}

.ams-alert.success{
    border-left-color:#16a34a;
}

.ams-alert.error{
    border-left-color:#dc2626;
}

.ams-alert.warning{
    border-left-color:#f59e0b;
}

.alert-icon{
    width:55px;
    height:55px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    flex-shrink:0;
}

.success .alert-icon{
    background:#dcfce7;
    color:#16a34a;
}

.error .alert-icon{
    background:#fee2e2;
    color:#dc2626;
}

.warning .alert-icon{
    background:#fef3c7;
    color:#f59e0b;
}

.alert-content h3{
    margin-bottom:8px;
    font-size:18px;
    color:var(--primary);
}

.alert-content p{
    color:var(--gray);
    line-height:1.7;
    font-size:14px;
}

.alert-close{
    margin-left:auto;
    background:none;
    border:none;
    font-size:18px;
    cursor:pointer;
    color:#94a3b8;
}

@media(max-width:600px){

    .ams-alert{
        left:20px;
        right:20px;
        min-width:auto;
        max-width:none;
    }

async function getActiveSubjectIds(){
    const { data: semester, error: semesterError } = await supabaseClient
        .from('semesters').select('semester_id').eq('is_active', true).maybeSingle();
    if(semesterError) throw semesterError;
    if(!semester) return new Set();
    const { data: subjects, error } = await supabaseClient
        .from('subjects').select('subject_id').eq('semester_id', semester.semester_id);
    if(error) throw error;
    return new Set((subjects || []).map(subject => String(subject.subject_id)));
}

let teacherUserId = null;
let teacherId = null;

function formatStudentTableName(student) {
    const middleInitial = String(student.middle_initial || '').trim();

/* =====================================================

async function initialize(){

    if (await beginTeacherOfflinePage(supabaseClient, 'students')) return;

    /* =========================
       GET LOGGED IN USER
    ========================= */

    const {
        data: { user },
        error
    } = await supabaseClient.auth.getUser();

    if(error || !user){

        console.log("User not logged in");
        return;

    }

    teacherUserId = user.id;

    /* =========================
       LOAD TEACHER
    ========================= */

    await loadTeacher();

    if(!teacherId){

        console.log("No teacher found");
        return;

    }

    /* =========================
       LOAD FILTERS
    ========================= */

    await loadYears();
    const warmRoute = new URLSearchParams(window.location.search);
    if (warmRoute.get('amsTeacherRosterWarm') === '1') {
        await loadTeacherRosterRoute(warmRoute);
        return;
    }
    await saveTeacherOfflineSnapshot(supabaseClient, 'students');


}

async function loadTeacherRosterRoute(route) {
    const yearLevel = route.get('year') || '';
    const departmentId = route.get('department_id') || '';
    const majorId = route.get('major_id') || '';
    const subjectId = route.get('subject_id') || '';
    const sectionId = route.get('section_id') || '';
    if (!yearLevel || !departmentId || !majorId || !subjectId || !sectionId) return;

    yearFilter.value = yearLevel;
    await loadDepartments(yearLevel);
    departmentFilter.value = departmentId;

    const { data: assignments, error } = await supabaseClient
        .from('teacher_subject_assignments')
        .select('subject_id, subjects(subject_id, subject_code, subject_name, year_level, major_id, majors(major_name, department_id)), teacher_section_assignments(section_id, sections(section_id, section_name, year_level, major_id))')
        .eq('teacher_id', teacherId);
    if (error) throw error;

    const activeSubjectIds = await getActiveSubjectIds();
    const majors = new Map();
    const subjects = new Map();
    const sections = new Map();
    (assignments || []).forEach(assignment => {
        const subject = assignment.subjects;
        if (!subject || !activeSubjectIds.has(String(subject.subject_id))
            || subject.year_level !== yearLevel
            || String(subject.majors?.department_id) !== String(departmentId)) return;
        majors.set(String(subject.major_id), subject.majors);
        if (String(subject.major_id) !== String(majorId)) return;
        subjects.set(String(subject.subject_id), subject);
        (assignment.teacher_section_assignments || []).forEach(sectionAssignment => {
            const section = sectionAssignment.sections;
            if (section && String(section.major_id) === String(majorId) && section.year_level === yearLevel) {
                sections.set(String(section.section_id), section);
            }
        });
    });

    majorFilter.innerHTML = '<option value="">Select Major</option>';
    majors.forEach((major, id) => majorFilter.add(new Option(major?.major_name || 'Major', id)));
    majorFilter.value = majorId;
    subjectFilter.innerHTML = '<option value="">Select Subject</option>';
    subjects.forEach((subject, id) => subjectFilter.add(new Option(`${subject.subject_code || ''} - ${subject.subject_name || ''}`, id)));
    subjectFilter.value = subjectId;
    sectionFilter.innerHTML = '<option value="">Select Section</option>';
    sections.forEach((section, id) => sectionFilter.add(new Option(section.section_name || 'Section', id)));
    sectionFilter.value = sectionId;
    await loadStudents();
}

/* =====================================================
DEPARTMENTS
===================================================== */

async function loadDepartments(yearLevel){
    departmentFilter.innerHTML = '<option value="">Select Department</option>';
    majorFilter.innerHTML = '<option value="">Select Major</option>';
    subjectFilter.innerHTML = '<option value="">Select Subject</option>';
    sectionFilter.innerHTML = '<option value="">Select Section</option>';

    if (!teacherId || !yearLevel) return;

    const { data, error } = await supabaseClient
        .from('teacher_subject_assignments')
        .select(`
            subject_id,
            subjects(
                subject_id,
                year_level,
                major_id,
                majors(
                    major_id,
                    major_name,
                    department_id,
                    departments(
                        department_id,
                        department_name
                    )
                )
            )
        `)
        .eq('teacher_id', teacherId);

    if (error) {
        console.log(error);
        return;
    }

    const activeSubjectIds = await getActiveSubjectIds();
    const departments = {};
    data?.forEach(item => {
        const subject = item.subjects;
        if (!subject || !activeSubjectIds.has(String(subject.subject_id)) || subject.year_level !== yearLevel) return;

        const department = subject.majors?.departments;
        if (department) {
            departments[department.department_id] = department;
        }
    });

    Object.values(departments).forEach(dep => {
        departmentFilter.innerHTML += `
            <option value="${dep.department_id}">
                ${dep.department_name}
            </option>
        `;
    });
}

/* =====================================================
LOAD TEACHER SUBJECTS
===================================================== */

async function loadTeacherSubjects(){

    if(!teacherId){

        console.log("Teacher ID missing");
        return;

    }

    const { data, error } = await supabaseClient

    .from("teacher_subject_assignments")

    .select(`
        assignment_id,
        subject_id,
        subjects(
            subject_id,
            subject_code,
            subject_name,
            major_id,
            year_level
        )
    `)

    .eq("teacher_id", teacherId);

    if(error){

        console.log(error);
        return;

    }

    console.log("ASSIGNED SUBJECTS:", data);

    const activeSubjectIds = await getActiveSubjectIds();
    const activeAssignments = (data || []).filter(item =>
        item.subjects && activeSubjectIds.has(String(item.subjects.subject_id))
    );

    subjectFilter.innerHTML = `
    
        <option value="">
            Select Subject
        </option>
    
    `;

    if(!activeAssignments.length){

        subjectFilter.innerHTML += `
        
            <option value="">
                No assigned subjects
            </option>
        
        `;

        return;

    }

    activeAssignments.forEach(item => {

        if(!item.subjects) return;

        subjectFilter.innerHTML += `
        
            <option
                value="${item.subjects.subject_id}"
            >

                ${item.subjects.subject_code}
                -
                ${item.subjects.subject_name}

            </option>
        
        `;

    });

}

/* =====================================================
SUBJECT CHANGE
===================================================== */

subjectFilter.addEventListener('change', async () => {
    sectionFilter.innerHTML = '<option value="">Select Section</option>';
    const subjectId = subjectFilter.value;
    if (!subjectId) return;

    const { data, error } = await supabaseClient
        .from('teacher_subject_assignments')

            teacher_section_assignments(
                section_id,
                sections(

        .eq('subject_id', subjectId);

    if (error) {

        return;

    const sections = {};
    data?.forEach(assign => {
        assign.teacher_section_assignments?.forEach(sec => {
            if (sec?.sections) sections[sec.sections.section_id] = sec.sections;
        });
    });

    Object.values(sections).forEach(sec => {
        sectionFilter.innerHTML += `<option value="${sec.section_id}">${sec.section_name}</option>`;

});

/* =====================================================
LOAD STUDENTS
===================================================== */

async function loadStudents(){

    const sectionId = sectionFilter.value;
    const subjectId = subjectFilter.value;

    if(!sectionId || !subjectId) return;

    tableBody.innerHTML = '<tr><td colspan="3" class="empty">Loading students...</td></tr>';

    const { data: students, error } =
    await supabaseClient

    .from("students")

    .select(`
        student_id,
        student_number,
        first_name,
        middle_initial,
        last_name,
        gender,
        sections(
            section_name
        )
    `)

    .eq("section_id", sectionId);

    if(error){

        console.log(error);
        await restoreTeacherOfflineSnapshot(supabaseClient, 'students', true);
        return;

    }

    tableBody.innerHTML = "";

    if(!students.length){
        tableBody.innerHTML = `
        <tr>
            <td colspan="3" class="empty">No students found</td>
        </tr>`;

        await saveTeacherOfflineSnapshot(supabaseClient, 'students');

        return;

    }

    const { data: grades, error: gradesError } = await supabaseClient
        .from("student_grades")
        .select("student_id, status, prelim_status, midterm_status, final_status")
        .eq("subject_id", subjectId)
        .in("student_id", students.map(student => student.student_id));

    if (gradesError) {
        console.error("Unable to load student grades", gradesError);
        await restoreTeacherOfflineSnapshot(supabaseClient, 'students', true);
        return;
    }

    const gradesByStudent = new Map((grades || []).map(grade => [String(grade.student_id), grade]));

    const orderedStudents = [
        ['Male', students.filter(student => student.gender === 'Male')],
        ['Female', students.filter(student => student.gender === 'Female')],
        ['Gender Not Set', students.filter(student => !['Male', 'Female'].includes(student.gender))]
    ].flatMap(([gender, group]) => [
        ...(group.length ? [{ genderHeader: gender }] : []),
        ...group.sort((first, second) =>
            `${first.last_name || ''}, ${first.first_name || ''}`.localeCompare(`${second.last_name || ''}, ${second.first_name || ''}`, undefined, { sensitivity: 'base' })
        )
    ]);

    for(const student of orderedStudents){

        if (student.genderHeader) {
            tableBody.innerHTML += `<tr class="student-gender-heading"><td colspan="3"><strong>${student.genderHeader}</strong></td></tr>`;
            continue;
        }

        const grade = gradesByStudent.get(String(student.student_id));

        const overallStatus = grade?.status || "PENDING";
        const termStatus = value => value || overallStatus;
        const statusClass = value => value === "PASSED"
            ? "status-approved"
            : value === "FAILED"
                ? "status-failed"
                : value === "INCOMPLETE"
                    ? "status-incomplete"
                    : "status-pending";
        const termStatuses = [
            ["Prelim", termStatus(grade?.prelim_status)],
            ["Midterm", termStatus(grade?.midterm_status)],
            ["Final", termStatus(grade?.final_status)]
        ];
        const statusParams = new URLSearchParams({
            student_id: String(student.student_id),
            year: yearFilter.value,
            department_id: departmentFilter.value,
            major_id: majorFilter.value,
            subject_id: subjectFilter.value,
            section_id: sectionFilter.value
        });
        const statusHtml = termStatuses
            .map(([term, status]) => `<a class="${statusClass(status)}" href="teacher_student_status.html?${statusParams.toString()}&term=${encodeURIComponent(term.toLowerCase())}" title="Open ${term} status and grades for this student"><strong>${term}:</strong> ${status}</a>`)
            .join("");

        const fullName = formatStudentTableName(student);

        tableBody.innerHTML += `

        <tr>

            <td>
                ${student.student_number}
            </td>

            <td>
                ${fullName}
            </td>

            <td>
                <div class="term-status-list">${statusHtml}</div>
            </td>

        </tr>

        `;
    }

    await saveTeacherOfflineSnapshot(supabaseClient, 'students');
}
/* =========================
   START PAGE
========================= */

initialize();
</script>
