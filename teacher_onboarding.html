<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Teacher Password | AMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--primary:#0b3d91;--secondary:#1f6bff;--light:#f4f7fc;--white:#fff;--text:#1e293b;--gray:#64748b;--border:#dbe4f0;--danger:#b42318}
        *{box-sizing:border-box}
        body{margin:0;min-height:100vh;background:var(--light);font-family:'Inter',sans-serif;color:var(--text);display:grid;place-items:center;padding:24px}
        .setup-shell{width:min(100%,560px);background:var(--white);border:1px solid var(--border);border-radius:12px;box-shadow:0 15px 40px rgba(11,61,145,.09);overflow:hidden}
        .setup-header{padding:25px 30px;border-bottom:1px solid var(--border)}
        .setup-header h1{font-size:22px;color:var(--primary);margin:0 0 5px;font-weight:800}
        .setup-header p,.setup-content>p{margin:0;color:var(--gray);font-size:13px;line-height:1.6}
        .setup-content{padding:28px 30px 30px}
        .field{display:flex;flex-direction:column;gap:7px;margin-top:16px}
        label{font-weight:600;font-size:14px;color:var(--primary)}
        input{width:100%;min-height:46px;padding:11px 13px;border:1px solid var(--border);border-radius:8px;background:white;color:var(--text);font:inherit}
        input:focus{outline:3px solid rgba(31,107,255,.15);border-color:var(--secondary)}
        .submit-button{margin-top:22px;width:100%;min-height:48px;border:0;border-radius:8px;background:var(--primary);color:white;font-weight:700;font-size:15px;cursor:pointer}
        .submit-button:disabled{opacity:.65;cursor:wait}
        .form-error{min-height:20px;margin-top:12px;color:var(--danger);font-size:14px}
        @media(max-width:560px){body{padding:12px}.setup-header{padding:20px}.setup-content{padding:22px 20px}}
    </style>
</head>
<body>
    <main class="setup-shell">
        <header class="setup-header">
            <h1>Choose Your Password</h1>
            <p>Academic Monitoring System · Talisay City College</p>
        </header>
        <section class="setup-content">
            <p>Your administrator created your teacher account. Set a new password to finish setup.</p>
            <form id="teacherSetupForm">
                <div class="field">
                    <label for="newPassword">New password</label>
                    <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
                </div>
                <div class="field">
                    <label for="confirmPassword">Confirm new password</label>
                    <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
                </div>
                <button id="saveButton" class="submit-button" type="submit">Save Password</button>
                <div id="formError" class="form-error" role="alert"></div>
            </form>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL='https://nrqrsolfowebujogawti.supabase.co';
        const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ycXJzb2xmb3dlYnVqb2dhd3RpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyODE2NjksImV4cCI6MjA5NDg1NzY2OX0.XcawTf9niOIZbG0hBTtwSXjySWfdVl3LAClbWdZmfl8';
        const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
        const FUNCTION_URL=`${SUPABASE_URL}/functions/v1/manage-teacher-accounts`;
        const form=document.getElementById('teacherSetupForm');
        const errorBox=document.getElementById('formError');
        const saveButton=document.getElementById('saveButton');

        async function initialize(){
            let {data:{session}}=await supabaseClient.auth.getSession();
            if(!session){
                const handoffValue=sessionStorage.getItem('ams_teacher_setup_session');
                if(handoffValue){
                    sessionStorage.removeItem('ams_teacher_setup_session');
                    try{
                        const restored=await supabaseClient.auth.setSession(JSON.parse(handoffValue));
                        session=restored.data?.session||null;
                    }catch{}
                }
            }
            if(!session){
                errorBox.innerHTML='Your sign-in session could not be restored. <a href="login.html">Return to Login</a> and sign in again.';
                return;
            }
            const {data:userData,error}=await supabaseClient.from('users')
                .select('role_id,onboarding_required,force_password_change')
                .eq('user_id',session.user.id).maybeSingle();
            if(error||!userData||Number(userData.role_id)!==2){
                errorBox.textContent='This setup page is only for teacher accounts.';
                return;
            }
            if(!userData.onboarding_required&&!userData.force_password_change
                &&!session.user.user_metadata?.onboarding_required&&!session.user.user_metadata?.force_password_change){
                errorBox.innerHTML='This account does not require password setup. <a href="teacher_dashboard.html">Continue to the teacher dashboard</a>.';
            }
        }

        form.addEventListener('submit',async event=>{
            event.preventDefault();
            errorBox.textContent='';
            const password=document.getElementById('newPassword').value;
            if(password!==document.getElementById('confirmPassword').value){
                errorBox.textContent='The passwords do not match.';
                return;
            }
            saveButton.disabled=true;
            saveButton.textContent='Saving...';
            try{
                const {data:{session},error:sessionError}=await supabaseClient.auth.getSession();
                if(sessionError)throw sessionError;
                if(!session)throw new Error('Your sign-in session expired. Return to Login and try again.');
                const response=await fetch(FUNCTION_URL,{
                    method:'POST',
                    headers:{'Content-Type':'application/json',apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${session.access_token}`},
                    body:JSON.stringify({action:'complete-password-change',password})
                });
                const result=await response.json();
                if(!response.ok)throw new Error(result.error||'Unable to save your password.');
                await supabaseClient.auth.signOut();
                form.innerHTML='<p>Your password has been saved. Return to the login page and sign in with your Teacher ID and new password.</p><a class="submit-button" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="login.html">Return to Login</a>';
                setTimeout(()=>window.location.replace('login.html'),5000);
            }catch(error){
                errorBox.textContent=error.message;
                saveButton.disabled=false;
                saveButton.textContent='Save Password';
            }
        });

        initialize().catch(error=>errorBox.textContent=error.message||'Unable to load password setup.');
    </script>
</body>
</html>
